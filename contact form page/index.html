<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Automation Hub – Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
    body{
        margin:0;
        background:linear-gradient(180deg,#0b1530,#0f1d3a,#0b1530);
        font-family:"Inter", sans-serif;
        color:white;
        overflow-x:hidden;
        animation:fadeInPage 1.5s ease;
    }

    @keyframes fadeInPage{
        from{opacity:0;} to{opacity:1;}
    }

    /* CONTENT */
    .content{
        max-width:900px;
        margin:40px auto;
        padding:20px;
        text-align:center;
        animation:slideUp 1s ease;
    }

    @keyframes slideUp{
        from{opacity:0; transform:translateY(40px);}
        to{opacity:1; transform:translateY(0);}
    }

    /* LOGO */
    .logo{
        width:95px;
        height:auto;
        margin-bottom:10px;
        border-radius:18px;
        animation:popIn 1s ease;
        box-shadow:0 0 25px rgba(255,255,255,0.15);
    }

    @keyframes popIn{
        0%{opacity:0; transform:scale(0.6);}
        100%{opacity:1; transform:scale(1);}
    }

    h1{
        margin:10px 0 0 0;
        font-size:34px;
        font-weight:800;
    }

    p{
        color:rgba(255,255,255,0.8);
        font-size:16px;
        margin-top:10px;
    }

    /* CTA BUTTON */
    .btn{
        display:inline-block;
        background:#f05124;
        padding:14px 28px;
        border-radius:14px;
        color:white;
        text-decoration:none;
        font-size:17px;
        font-weight:600;
        margin-top:20px;
        box-shadow:0 10px 22px rgba(240,81,36,0.45);
        transition:0.3s;
    }

    .btn:hover{
        transform:translateY(-4px);
        box-shadow:0 14px 28px rgba(240,81,36,0.6);
    }

    /* FORM CARD */
    .form-box{
        margin-top:45px;
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(10px);
        padding:28px;
        border-radius:22px;
        border:1px solid rgba(255,255,255,0.12);
        box-shadow:0 15px 40px rgba(0,0,0,0.35);
        animation:fadeIn 1.4s ease;
    }

    @keyframes fadeIn{
        from{opacity:0;} to{opacity:1;}
    }

    iframe{
        width:100%;
        height:950px;
        border:0;
        border-radius:18px;
    }

    @media(max-width:900px){
        iframe{height:1200px;}
        h1{font-size:28px;}
    }

    /* FLOATING WHATSAPP BUTTON */
    .float-whatsapp{
        position:fixed;
        bottom:25px;
        right:25px;
        background:#25d366;
        width:60px;
        height:60px;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.4);
        animation:whatsIn 1s ease;
        z-index:999;
    }

    @keyframes whatsIn{
        from{opacity:0; transform:scale(0.5);}
        to{opacity:1; transform:scale(1);}
    }

    .float-whatsapp img{
        width:34px;
        height:34px;
    }

    /* FOOTER */
    footer{
        text-align:center;
        padding:25px;
        margin-top:50px;
        font-size:14px;
        color:rgba(255,255,255,0.5);
    }

</style>
</head>
